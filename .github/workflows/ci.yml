name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: scripts/check.sh
      - name: Restore smoke ground truth
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/smoke/cache
          key: smoke-prep-${{ matrix.os }}-${{ hashFiles('corpus/v0.json', 'harness/grids/smoke.json', 'harness/grids/smoke_curved.json', 'harness/src/unmesh_harness/groundtruth/**', 'harness/src/unmesh_harness/labels.py', 'harness/src/unmesh_harness/corpus.py', 'harness/src/unmesh_harness/runner/execute.py', 'harness/src/unmesh_harness/degrade/__init__.py', 'harness/src/unmesh_harness/degrade/fillets.py', 'harness/src/unmesh_harness/degrade/retriangulate.py') }}
      - name: Pin smoke grids to main for PR compare
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth 1
          git show FETCH_HEAD:harness/grids/smoke.json > harness/grids/smoke.json
          if git show "FETCH_HEAD:harness/grids/smoke_curved.json" > "$RUNNER_TEMP/smoke_curved.main.json" 2>/dev/null; then
            cp "$RUNNER_TEMP/smoke_curved.main.json" harness/grids/smoke_curved.json
            echo "pinned smoke_curved.json to main"
          else
            echo "no smoke_curved.json on main yet; running the PR copy (bootstrap)"
          fi
          git diff --stat
      - name: Smoke grids
        env:
          UV_LOCKED: "1"
        run: |
          start=$(date +%s)
          uv run unmesh-harness run --converter unmesh --grid smoke --out "$RUNNER_TEMP/smoke" --gate
          uv run unmesh-harness run --converter unmesh --grid smoke_curved --out "$RUNNER_TEMP/smoke" --gate
          echo "smoke grids wall time: $(( $(date +%s) - start )) s"
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke/*.jsonl
          if-no-files-found: ignore
      - name: Cache Rust target for the main-tree compare build
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cargo-target-main
          key: compare-target-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'crates/**/Cargo.toml', 'crates/**/*.rs') }}
          restore-keys: |
            compare-target-${{ matrix.os }}-
      - name: Compare against main baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target-main
        run: |
          main_tree="$RUNNER_TEMP/unmesh-main"
          base="$RUNNER_TEMP/baseline"
          mkdir -p "$base"
          git fetch origin main --depth 1
          git worktree remove --force "$main_tree" 2>/dev/null || true
          rm -rf "$main_tree"
          git worktree add --detach "$main_tree" FETCH_HEAD
          compare_grid() {
            grid="$1"
            shift
            if ! uv run --locked scripts/ci-baseline-plan \
              --repo "$GITHUB_REPOSITORY" \
              --base-sha "${{ github.event.pull_request.base.sha }}" \
              --artifact "smoke-results-${{ matrix.os }}" \
              --select "$grid" \
              "$@" \
              --out "$base/$grid.jsonl" \
              --main-tree "$main_tree"; then
              return 1
            fi
            if [ ! -e "$base/$grid.jsonl" ]; then
              echo "no $grid baseline (gate skipped upstream or grid is new); nothing to compare"
              return 0
            fi
            if [ ! -s "$base/$grid.jsonl" ]; then
              echo "::error::$grid baseline artifact is empty; failing instead of silently passing"
              return 1
            fi
            if [ ! -s "$RUNNER_TEMP/smoke/$grid.jsonl" ]; then
              echo "::error::PR produced no $grid results; failing instead of silently passing"
              return 1
            fi
            if uv run --project "$main_tree" --locked unmesh-harness compare \
              "$base/$grid.jsonl" "$RUNNER_TEMP/smoke/$grid.jsonl"; then
              echo "compare ($grid): no regressions"
              return 0
            fi
            echo "compare ($grid): regressions found, checking for an approved waiver"
            if uv run --project "$main_tree" --locked python "$main_tree/scripts/check-waiver" \
              --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" \
              --run-a "$base/$grid.jsonl" --run-b "$RUNNER_TEMP/smoke/$grid.jsonl"; then
              echo "compare ($grid): regression waived"
              return 0
            fi
            echo "compare ($grid): regressions without an approved waiver"
            return 1
          }
          status_smoke=0
          status_curved=0
          compare_grid smoke || status_smoke=$?
          compare_grid smoke_curved --allow-missing || status_curved=$?
          if [ "$status_smoke" -ne 0 ] || [ "$status_curved" -ne 0 ]; then
            exit 1
          fi
      - name: Wheel imports on Python 3.11 without OCP
        run: |
          uv build --wheel -o "$RUNNER_TEMP/wheels"
          uv venv --python 3.11 "$RUNNER_TEMP/bare"
          uv pip install --python "$RUNNER_TEMP/bare/bin/python" "$RUNNER_TEMP"/wheels/*.whl
          "$RUNNER_TEMP/bare/bin/python" -c "import sys, unmesh; assert 'OCP' not in sys.modules; print(unmesh.__version__)"
          if "$RUNNER_TEMP/bare/bin/python" -c "import OCP" 2>/dev/null; then exit 1; fi
