name: tmp-probe
on:
  push:
    branches: [i11-runner]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: probe
        run: |
          nproc; cat /proc/cpuinfo | grep "model name" | head -1
          ls -la python/unmesh/*.so
          uv run python - <<'PY'
          import os, time, tempfile
          print(os.cpu_count(), len(os.sched_getaffinity(0)))
          import unmesh
          from unmesh_harness.corpus import load_manifest, select
          from unmesh_harness.groundtruth import generate
          from unmesh_harness.labels import tessellate
          from unmesh_harness.degrade import apply_chain
          from unmesh_harness.judge import judge
          d = tempfile.mkdtemp()
          e = select(load_manifest(), "smoke")[0]
          m = tessellate(generate(e["family"], e["seed"]).solid, 0.01, 0.2)
          dm = apply_chain(m, [("refine", 0.15), ("noise_off_plane", 0.1)], 0)
          dm.write_stl(d + "/a.stl")
          tris = unmesh.read_stl(d + "/a.stl")
          for _ in range(2):
              t = time.perf_counter(); ir, rep = unmesh.convert(tris); print("convert", time.perf_counter() - t)
          for s in (10, 1):
              t = time.perf_counter(); judge(ir, tris, m.tris, rep, samples_per_mm2=s); print("judge", s, time.perf_counter() - t)
          t = time.perf_counter(); judge(ir, tris, m.tris, rep, include_vertices=False); print("judge novert", time.perf_counter() - t)
          t = time.perf_counter(); judge(ir, tris, None, rep); print("judge notruth", time.perf_counter() - t)
          PY
