[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unmesh-harness"
version = "0.1.0"
description = "Evaluation harness for unmesh."
requires-python = ">=3.11"
dependencies = [
    "unmesh",
    "numpy>=1.26",
    "scipy>=1.16",
    "build123d>=0.10,<0.11",
    "cadquery-ocp>=7.8,<7.9",
    "ocp-gordon>=0.1.17,<0.2",
    "psutil>=5.9",
]

[project.scripts]
unmesh-harness = "unmesh_harness.cli:main"

[project.optional-dependencies]
gpl = ["pymeshlab"]

[tool.hatch.build.targets.wheel]
packages = ["src/unmesh_harness"]

[tool.uv.sources]
unmesh = { workspace = true }
